<!DOCTYPE html>
<html lang="de">
<head>
    <meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e1f">
<meta name="description" content="AstroWahr – Astronomie und Astrologie: Geburtshoroskop, Tageshoroskop, Transite, Kompatibilität, Mondkalender, Tarot sowie Live-Himmel, Planeten-Fakten und Sonnenzeiten, komplett offline berechnet.">
<title>AstroWahr</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AstroWahr">
<link rel="stylesheet" href="style.css">
<script>
(function () {
  try {
    var pref = localStorage.getItem('astrowahr.theme') || 'dark';
    var effective = pref === 'system' ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
    if (effective === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();
</script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <button class="back-btn" id="backBtn" style="display:none;" aria-label="Zurück">←</button>
    <div class="brand" id="brandHeader">
      <div class="brand-badge">✨</div>
      <h1>AstroWahr</h1>
    </div>
    <button class="topbar-search-btn" id="searchBtn" aria-label="Suche">🔍</button>
  </header>

  <main id="view">

    <!-- START (Weiche: Astronomie / Astrologie) -->
    <section class="tab" id="tab-start" data-title="AstroWahr">
      <div class="hero-card">
        <div class="hero-date" id="heroDate">–</div>
        <div style="font-weight:700; font-size:1.05rem;">Heute am Himmel</div>
        <div class="hero-row" id="heroSky"></div>
      </div>
      <h2 class="section-title">Wohin möchtest du?</h2>
      <div class="bento" id="forkBento"></div>
    </section>

    <!-- ASTROLOGIE (Hub) -->
    <section class="tab" id="tab-astrologie" data-title="Astrologie">
      <h2 class="section-title">Astrologie</h2>
      <div class="bento" id="astrologieBento"></div>
      <h2 class="section-title">Deine Profile</h2>
      <div id="astrologieProfiles"></div>
    </section>

    <!-- ASTRONOMIE (Hub) -->
    <section class="tab" id="tab-astronomie" data-title="Astronomie">
      <h2 class="section-title">Astronomie</h2>
      <p class="hint">Reine, unabhängig überprüfbare Himmelsmechanik und Fakten – ohne symbolische Deutung.</p>
      <div class="bento" id="astronomieBento"></div>
    </section>

    <!-- ASTRONOMIE: HIMMEL JETZT -->
    <section class="tab" id="tab-astro-live" data-title="Himmel jetzt">
      <div id="astroLiveRoot"></div>
    </section>

    <!-- ASTRONOMIE: PLANETEN-STECKBRIEFE -->
    <section class="tab" id="tab-astro-planets" data-title="Planeten-Steckbriefe">
      <div id="astroPlanetsRoot"></div>
    </section>

    <!-- ASTRONOMIE: SONNENAUF-/-UNTERGANG -->
    <section class="tab" id="tab-astro-sun" data-title="Sonnenauf-/-untergang">
      <div id="astroSunRoot"></div>
    </section>

    <!-- ASTRONOMIE: STERNBILDER & PRÄZESSION -->
    <section class="tab" id="tab-astro-precession" data-title="Sternbilder & Präzession">
      <div id="astroPrecessionRoot"></div>
    </section>

    <!-- ASTRONOMIE: JAHRESZEITEN -->
    <section class="tab" id="tab-astro-seasons" data-title="Jahreszeiten-Rechner">
      <div id="astroSeasonsRoot"></div>
    </section>

    <!-- ASTRONOMIE: STERNENHIMMELKARTE -->
    <section class="tab" id="tab-astro-skymap" data-title="Sternenhimmelkarte">
      <div id="astroSkymapRoot"></div>
    </section>

    <!-- WELTRAUMKUNDE (Hub) -->
    <section class="tab" id="tab-weltraum" data-title="Weltraumkunde">
      <div id="weltraumRoot"></div>
    </section>

    <!-- WELTRAUMKUNDE: LEXIKON -->
    <section class="tab" id="tab-weltraum-lexikon" data-title="Weltraumkunde-Lexikon">
      <div id="weltraumLexikonRoot"></div>
    </section>

    <!-- WELTRAUMKUNDE: STERNENTWICKLUNG -->
    <section class="tab" id="tab-weltraum-sterne" data-title="Sternentwicklung">
      <div id="weltraumSterneRoot"></div>
    </section>

    <!-- WELTRAUMKUNDE: RAUMFAHRT-ZEITSTRAHL -->
    <section class="tab" id="tab-weltraum-zeitstrahl" data-title="Raumfahrt-Zeitstrahl">
      <div id="weltraumZeitstrahlRoot"></div>
    </section>

    <!-- TAGESHOROSKOP -->
    <section class="tab" id="tab-horoskop" data-title="Tageshoroskop">
      <p class="hint">Wähle dein Sternzeichen für den heutigen Impuls – berechnet aus echter Mond- und Planetenstellung, täglich neu.</p>
      <div class="sign-grid" id="horoskopSignGrid"></div>
      <div id="horoskopResult"></div>
    </section>

    <!-- GEBURTSHOROSKOP -->
    <section class="tab" id="tab-chart" data-title="Geburtshoroskop">
      <div id="chartRoot"></div>
    </section>

    <!-- TRANSITE -->
    <section class="tab" id="tab-transite" data-title="Transite">
      <div id="transiteRoot"></div>
    </section>

    <!-- KOMPATIBILITÄT -->
    <section class="tab" id="tab-kompat" data-title="Kompatibilität">
      <div id="kompatRoot"></div>
    </section>

    <!-- MONDKALENDER -->
    <section class="tab" id="tab-mond" data-title="Mondkalender">
      <div id="mondRoot"></div>
    </section>

    <!-- TAROT -->
    <section class="tab" id="tab-tarot" data-title="Tarot">
      <div id="tarotRoot"></div>
    </section>

    <!-- ASTRO-LEXIKON -->
    <section class="tab" id="tab-astrolex" data-title="Astro-Lexikon">
      <div id="astrolexRoot"></div>
    </section>

    <!-- MEHR -->
    <section class="tab" id="tab-mehr" data-title="Mehr">
      <div class="bento" id="mehrBento"></div>
    </section>

    <!-- ANLEITUNG -->
    <section class="tab" id="tab-anleitung" data-title="Anleitung">
      <div id="anleitungRoot" class="legal-content"></div>
    </section>

    <!-- EINSTELLUNGEN -->
    <section class="tab" id="tab-einstellungen" data-title="Einstellungen">
      <div id="einstellungenRoot"></div>
    </section>

    <!-- RECHTLICHES -->
    <section class="tab" id="tab-rechtliches" data-title="Rechtliches">
      <div id="rechtlichesRoot"></div>
    </section>

    <!-- IMPRESSUM -->
    <section class="tab" id="tab-impressum" data-title="Impressum">
      <div class="legal-content" id="impressumInline"></div>
    </section>

    <!-- DATENSCHUTZ -->
    <section class="tab" id="tab-datenschutz" data-title="Datenschutz">
      <div class="legal-content" id="datenschutzInline"></div>
    </section>

  </main>

  <nav class="bottom-nav">
    <button data-tab="start"><span class="nav-glyph">🏠</span>Start</button>
    <button data-tab="astronomie"><span class="nav-glyph">🔭</span>Astronomie</button>
    <button data-tab="astrologie"><span class="nav-glyph">🔮</span>Astrologie</button>
    <button data-tab="mehr"><span class="nav-glyph">☰</span>Mehr</button>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <button class="modal-close" id="modalClose" aria-label="Schließen">×</button>
      <div class="modal-content" id="modalContent"></div>
      <div class="modal-zoom-controls" id="modalZoomControls" style="display:none;">
        <button id="zoomOutBtn">－</button>
        <button id="zoomResetBtn">100%</button>
        <button id="zoomInBtn">＋</button>
      </div>
    </div>
  </div>
</div>

<script src="no-zoom.js"></script>
<script src="astro.js"></script>
<script src="tarot-cards.js"></script>
<script src="tarot-art.js"></script>
<script src="app.js"></script>
</body>
</html>
